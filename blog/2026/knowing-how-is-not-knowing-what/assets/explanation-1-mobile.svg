<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img"><title>An operation can succeed while a required approval is missing.</title><metadata>Authored vector diagram. Fictional example based on the refund discussion in Knowing How Is Not Knowing What. Numbers and people are illustrative.</metadata><rect width="100%" height="100%" fill="#fff"/><rect x="24" y="24" width="432" height="310" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><text x="44" y="73" font-family="Arial, sans-serif" font-size="29" fill="#252326" font-weight="600">Refund RF-042</text><rect x="44" y="96" width="392" height="1" fill="#D8D3DA" /><text x="44" y="142" font-family="Arial, sans-serif" font-size="23" fill="#68616A" font-weight="400">Amount</text><text x="259" y="143" font-family="Arial, sans-serif" font-size="30" fill="#252326" font-weight="400">$8,000</text><rect x="44" y="164" width="392" height="1" fill="#D8D3DA" /><text x="44" y="210" font-family="Arial, sans-serif" font-size="23" fill="#68616A" font-weight="400">State</text><text x="259" y="210" font-family="Arial, sans-serif" font-size="23" fill="#252326" font-weight="400">Submitted</text><rect x="44" y="232" width="392" height="1" fill="#D8D3DA" /><text x="44" y="286" font-family="Arial, sans-serif" font-size="23" fill="#68616A" font-weight="400">2nd approval</text><text x="259" y="286" font-family="Arial, sans-serif" font-size="23" fill="#994319" font-weight="600">Missing</text><text x="24" y="410" font-family="Arial, sans-serif" font-size="22" fill="#68616A" font-weight="400">Refund policy</text><rect x="24" y="432" width="432" height="1" fill="#D8D3DA" /><text x="24" y="490" font-family="Arial, sans-serif" font-size="30" fill="#252326" font-weight="400">Above $5,000</text><text x="24" y="533" font-family="Arial, sans-serif" font-size="25" fill="#252326" font-weight="400">Second approval required</text><text x="24" y="619" font-family="Arial, sans-serif" font-size="18" fill="#68616A" font-weight="400">Fictional example</text></svg>