<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img"><title>An operation can succeed while a required approval is missing.</title><metadata>Authored vector diagram. Fictional example based on the refund discussion in Knowing How Is Not Knowing What. Numbers and people are illustrative.</metadata><rect width="100%" height="100%" fill="#fff"/><rect x="32" y="34" width="580" height="320" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><text x="56" y="80" font-family="Arial, sans-serif" font-size="28" fill="#252326" font-weight="600">Refund RF-042</text><rect x="56" y="105" width="532" height="1" fill="#D8D3DA" /><text x="56" y="152" font-family="Arial, sans-serif" font-size="24" fill="#68616A" font-weight="400">Amount</text><text x="340" y="155" font-family="Arial, sans-serif" font-size="32" fill="#252326" font-weight="400">$8,000</text><rect x="56" y="178" width="532" height="1" fill="#D8D3DA" /><text x="56" y="220" font-family="Arial, sans-serif" font-size="24" fill="#68616A" font-weight="400">State</text><text x="340" y="220" font-family="Arial, sans-serif" font-size="24" fill="#252326" font-weight="400">Submitted</text><rect x="56" y="242" width="532" height="1" fill="#D8D3DA" /><text x="56" y="294" font-family="Arial, sans-serif" font-size="24" fill="#68616A" font-weight="400">Second approval</text><rect x="334" y="265" width="250" height="49" fill="#FFF7F2" stroke="#994319" stroke-width="1"/><text x="351" y="296" font-family="Arial, sans-serif" font-size="24" fill="#994319" font-weight="600">Missing</text><text x="728" y="110" font-family="Arial, sans-serif" font-size="22" fill="#68616A" font-weight="400">Refund policy</text><rect x="728" y="128" width="325" height="1" fill="#D8D3DA" /><text x="728" y="184" font-family="Arial, sans-serif" font-size="30" fill="#252326" font-weight="400">Above $5,000</text><text x="728" y="227" font-family="Arial, sans-serif" font-size="24" fill="#252326" font-weight="400">Second approval required</text><path d="M630 293h64m-5 -5 6 5-6 5" fill="none" stroke="#994319" stroke-width="1.5"/><text x="728" y="345" font-family="Arial, sans-serif" font-size="18" fill="#68616A" font-weight="400">Fictional example</text></svg>