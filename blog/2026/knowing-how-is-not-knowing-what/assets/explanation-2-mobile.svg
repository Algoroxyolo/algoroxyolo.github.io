<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 750" role="img"><title>A policy, team directory and email identify the delegated approver.</title><metadata>Authored vector diagram. Fictional example based on the refund discussion in Knowing How Is Not Knowing What. Numbers and people are illustrative.</metadata><rect width="100%" height="100%" fill="#fff"/><rect x="24" y="24" width="432" height="196" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><rect x="24" y="251" width="432" height="196" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><rect x="24" y="478" width="432" height="196" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><text x="44" y="63" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="400">Policy excerpt</text><rect x="44" y="83" width="392" height="1" fill="#D8D3DA" /><text x="44" y="135" font-family="Arial, sans-serif" font-size="30" fill="#252326" font-weight="400">&gt;$5,000</text><text x="44" y="181" font-family="Arial, sans-serif" font-size="24" fill="#252326" font-weight="400">Second approver required</text><text x="44" y="290" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="400">Team directory</text><rect x="44" y="310" width="392" height="1" fill="#D8D3DA" /><text x="44" y="357" font-family="Arial, sans-serif" font-size="25" fill="#252326" font-weight="400">Maya · second approver</text><text x="44" y="405" font-family="Arial, sans-serif" font-size="24" fill="#994319" font-weight="400">Away this week</text><text x="44" y="517" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="400">From: Maya</text><rect x="44" y="537" width="392" height="1" fill="#D8D3DA" /><text x="44" y="584" font-family="Arial, sans-serif" font-size="25" fill="#252326" font-weight="400">Out of office</text><text x="44" y="633" font-family="Arial, sans-serif" font-size="25" fill="#A3089A" font-weight="600">“Priya covers approvals.”</text><text x="24" y="723" font-family="Arial, sans-serif" font-size="18" fill="#68616A" font-weight="400">Fictional example</text></svg>