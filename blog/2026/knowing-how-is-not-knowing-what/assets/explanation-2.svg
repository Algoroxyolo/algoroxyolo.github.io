<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img"><title>A policy, team directory and email identify the delegated approver.</title><metadata>Authored vector diagram. Fictional example based on the refund discussion in Knowing How Is Not Knowing What. Numbers and people are illustrative.</metadata><rect width="100%" height="100%" fill="#fff"/><rect x="32" y="46" width="285" height="230" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><text x="52" y="85" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="400">Policy excerpt</text><rect x="52" y="106" width="245" height="1" fill="#D8D3DA" /><text x="52" y="163" font-family="Arial, sans-serif" font-size="31" fill="#252326" font-weight="400">&gt;$5,000</text><text x="52" y="210" font-family="Arial, sans-serif" font-size="23" fill="#252326" font-weight="400">Second approver</text><text x="52" y="242" font-family="Arial, sans-serif" font-size="23" fill="#252326" font-weight="400">required</text><rect x="405" y="46" width="260" height="230" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><text x="425" y="85" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="400">Team directory</text><rect x="425" y="106" width="220" height="1" fill="#D8D3DA" /><text x="425" y="163" font-family="Arial, sans-serif" font-size="31" fill="#252326" font-weight="400">Maya</text><text x="425" y="210" font-family="Arial, sans-serif" font-size="23" fill="#252326" font-weight="400">Second approver</text><text x="425" y="240" font-family="Arial, sans-serif" font-size="21" fill="#994319" font-weight="400">Away this week</text><rect x="753" y="46" width="315" height="230" fill="#FFFFFF" stroke="#D8D3DA" stroke-width="1"/><text x="773" y="85" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="400">From: Maya</text><rect x="773" y="106" width="275" height="1" fill="#D8D3DA" /><text x="773" y="159" font-family="Arial, sans-serif" font-size="27" fill="#252326" font-weight="400">Out of office</text><text x="773" y="212" font-family="Arial, sans-serif" font-size="25" fill="#A3089A" font-weight="600">“Priya covers</text><text x="773" y="246" font-family="Arial, sans-serif" font-size="25" fill="#A3089A" font-weight="600">approvals.”</text><path d="M328 207h59m-5 -5 6 5-6 5" fill="none" stroke="#68616A" stroke-width="1.5"/><path d="M676 154h59m-5 -5 6 5-6 5" fill="none" stroke="#68616A" stroke-width="1.5"/><text x="32" y="321" font-family="Arial, sans-serif" font-size="18" fill="#68616A" font-weight="400">Fictional example</text></svg>