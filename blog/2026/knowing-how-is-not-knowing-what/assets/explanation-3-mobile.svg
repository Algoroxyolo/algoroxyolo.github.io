<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 790" role="img"><title>GUI, API and CLI show the same approved refund record.</title><metadata>Authored vector diagram. Fictional example based on the refund discussion in Knowing How Is Not Knowing What. Numbers and people are illustrative.</metadata><rect width="100%" height="100%" fill="#fff"/><text x="24" y="50" font-family="Arial, sans-serif" font-size="28" fill="#252326" font-weight="600">RF-042 · after approval</text><text x="24" y="86" font-family="Arial, sans-serif" font-size="19" fill="#68616A" font-weight="400">Fictional example</text><rect x="24" y="115" width="432" height="1" fill="#D8D3DA" /><text x="24" y="157" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="600">GUI</text><text x="24" y="208" font-family="Arial, sans-serif" font-size="29" fill="#252326" font-weight="400">RF-042</text><text x="24" y="246" font-family="Arial, sans-serif" font-size="25" fill="#A3089A" font-weight="400">Approved by Priya</text><rect x="24" y="278" width="432" height="1" fill="#D8D3DA" /><text x="24" y="320" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="600">API</text><text x="24" y="368" font-family="Arial, sans-serif" font-size="25" fill="#252326" font-weight="400">id: &quot;RF-042&quot;</text><text x="24" y="409" font-family="Arial, sans-serif" font-size="25" fill="#A3089A" font-weight="400">status: &quot;approved&quot;</text><text x="24" y="450" font-family="Arial, sans-serif" font-size="25" fill="#252326" font-weight="400">approver: &quot;Priya&quot;</text><rect x="24" y="486" width="432" height="1" fill="#D8D3DA" /><text x="24" y="528" font-family="Arial, sans-serif" font-size="20" fill="#68616A" font-weight="600">CLI</text><text x="24" y="575" font-family="Arial, sans-serif" font-size="24" fill="#252326" font-weight="400">$ refund show RF-042</text><text x="24" y="617" font-family="Arial, sans-serif" font-size="25" fill="#A3089A" font-weight="400">approved / Priya</text><rect x="24" y="650" width="432" height="1" fill="#D8D3DA" /><text x="24" y="694" font-family="Arial, sans-serif" font-size="21" fill="#68616A" font-weight="400">Grader reads RF-042:</text><text x="24" y="741" font-family="Arial, sans-serif" font-size="26" fill="#252326" font-weight="400">second approval = recorded</text></svg>