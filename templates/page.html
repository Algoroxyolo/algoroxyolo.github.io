<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | {{DISPLAY_NAME}}</title>
<meta name="author" content="{{DISPLAY_NAME}}">
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="https://algoroxyolo.github.io{{ROUTE}}">
<link rel="icon" href="/assets/img/favicon.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try { const t=localStorage.getItem('theme'); document.documentElement.dataset.theme=t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; } catch (_) {}</script>
<link rel="stylesheet" href="/assets/css/academic.css?v={{STYLE_VERSION}}">
<script defer src="/assets/js/site.js?v={{SITE_VERSION}}"></script>
<script defer src="/assets/js/research.js?v={{SCRIPT_VERSION}}"></script>
<script data-goatcounter="https://algoroxyolo.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body class="fixed-top-nav {{PAGE_CLASS}}">
<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header"><nav class="container site-nav" aria-label="Main navigation"><a class="site-name" href="/">{{NAME}}</a><ul class="site-links">{{NAVIGATION}}</ul><button type="button" id="light-toggle" aria-label="Change theme">Theme</button></nav></header>
<main id="main-content" class="container"><div class="post"><header class="post-header"><h1 class="post-title">{{TITLE}}</h1><p class="post-description">{{SUBTITLE}}</p></header><article class="academic-content">{{BODY}}</article></div></main>
<footer class="academic-footer"><div class="container footer-row"><span>© 2026 {{DISPLAY_NAME}}</span><nav aria-label="Additional links"><a href="/teaching/">Teaching &amp; mentoring</a><a href="/news/">News</a><a href="/#contact">Contact</a><a href="/feed.xml">RSS</a></nav></div></footer>
</body>
</html>
